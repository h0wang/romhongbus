<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romhongbus — Claw ⚡</title>
<style>
  :root {
    --bg: #0d0d0d; --panel: #1a1a1a; --panel2: #141414;
    --border: #2a2a2a; --border2: #222;
    --text: #e0e0e0; --muted: #666; --accent: #00ccaa;
    --green: #00c88a; --red: #ff4444; --orange: #ff9900;
    --purple: #aa88ff; --input-bg: #111;
    --sidebar-w: 220px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;
    display: flex; flex-direction: column;
  }

  /* ── Topbar ── */
  .topbar {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 7px 12px; display: flex; align-items: center; gap: 10px;
    flex-shrink: 0; z-index: 10;
  }
  #sidebar-toggle {
    background: none; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font-size: 16px;
    padding: 2px 8px; border-radius: 4px; line-height: 1; flex-shrink: 0;
  }
  #sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .logo { font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
  .portfolio-group { display: flex; align-items: center; gap: 5px; }
  #portfolio-select {
    background: var(--input-bg); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 4px 8px;
    border-radius: 4px; outline: none; cursor: pointer;
  }
  #portfolio-select:focus { border-color: var(--accent); }
  #portfolio-info {
    font-size: 11px; color: var(--muted); max-width: 200px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ticker-input-group { display: flex; align-items: center; gap: 5px; }
  .ticker-input-group label { color: var(--muted); font-size: 12px; }
  #ticker-input {
    background: var(--input-bg); border: 1px solid var(--border);
    color: var(--accent); font-size: 15px; font-weight: 700;
    padding: 4px 9px; width: 120px; border-radius: 4px; outline: none; text-transform: uppercase;
  }
  #ticker-input:focus { border-color: var(--accent); }
  .tf-tabs { display: flex; gap: 2px; background: var(--input-bg); border-radius: 5px; padding: 3px; }
  .tf-btn {
    background: none; border: none; color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 4px 11px;
    border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }
  .tf-btn:hover { color: var(--text); }
  .tf-btn.active { background: #00ccaa22; color: var(--accent); }
  #load-btn {
    background: var(--accent); color: #000; border: none;
    font-size: 12px; font-weight: 700; padding: 5px 13px; border-radius: 4px; cursor: pointer;
  }
  #load-btn:hover { opacity: 0.85; }
  #refresh-btn {
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    font-size: 14px; padding: 4px 8px; border-radius: 4px; cursor: pointer; line-height: 1;
  }
  #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  .status { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .status.ok { color: var(--green); }

  /* ── Settings bar ── */
  .settings-bar {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 5px 12px; display: flex; align-items: center; gap: 8px 12px;
    flex-shrink: 0; flex-wrap: wrap; row-gap: 5px;
  }
  .sec-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted);
    padding-right: 4px; border-right: 1px solid var(--border);
    margin-right: 2px; white-space: nowrap;
  }
  .grp { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  .grp label { white-space: nowrap; }
  .grp input[type="number"] {
    background: var(--input-bg); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 3px 5px;
    width: 48px; border-radius: 3px; outline: none;
  }
  .grp input[type="number"]:focus { border-color: var(--accent); }
  .tgl { display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
  .tgl input { cursor: pointer; accent-color: var(--accent); }
  .tgl-label { white-space: nowrap; }
  .tgl-label.sma20 { color: #e0e0e0; }
  .tgl-label.sma60 { color: #ff4444; }
  .tgl-label.sma120 { color: #4488ff; }
  .tgl-label.sma200 { color: #00c88a; }
  .sep { color: var(--border); font-size: 18px; flex-shrink: 0; }

  /* ── Body layout ── */
  .body-layout { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--panel2); border-right: 1px solid var(--border);
    overflow-y: auto; overflow-x: hidden;
    transition: width 0.2s ease, opacity 0.2s ease;
  }
  .sidebar.collapsed {
    width: 0; opacity: 0; overflow: hidden; border-right: none;
  }
  .sidebar-section { border-bottom: 1px solid var(--border2); }
  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; cursor: pointer; user-select: none;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .sidebar-header:hover { color: var(--text); }
  .sidebar-header .arrow { font-size: 9px; transition: transform 0.15s; }
  .sidebar-section.collapsed .arrow { transform: rotate(-90deg); }
  .sidebar-section.collapsed .ticker-list { display: none; }
  .ticker-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px 8px; }
  .ticker-chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 8px; font-size: 11px; font-weight: 600;
    color: var(--text); cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .ticker-chip:hover { border-color: var(--accent); color: var(--accent); background: #00ccaa15; }
  .ticker-chip.active { background: #00ccaa22; border-color: var(--accent); color: var(--accent); }
  .sidebar-loading { padding: 12px 10px; color: var(--muted); font-size: 11px; }

  /* ── Chart ── */
  .chart-area { flex: 1; overflow: hidden; position: relative; }
  #chart-container { width: 100%; height: 100%; position: relative; }
  #chart { width: 100%; height: 100%; }
  .placeholder {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; flex-direction: column; gap: 10px;
  }
  .placeholder.hidden { display: none; }
  .placeholder .emoji { font-size: 40px; opacity: 0.3; }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Portfolio Modal ── */
  #portfolio-modal {
    display: none;           /* shown by JS */
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center; justify-content: center;
  }
  #portfolio-modal.open { display: flex; }
  #portfolio-modal.maximised {
    background: var(--bg);
    flex-direction: column;
  }
  #portfolio-modal.maximised #portfolio-chart-area {
    flex: 1; min-height: 0;
  }
  #portfolio-modal.maximised #portfolio-modal-body {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    border-radius: 0; margin: 0; max-width: 100%; max-height: 100%;
  }
  #portfolio-modal.maximised .modal-chart-area { flex: 1; min-height: 0; }
  #portfolio-modal.maximised .modal-holdings { flex: 1; overflow-y: auto; }

  #portfolio-modal-body {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 520px; max-height: 80vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-tabs { display: flex; gap: 4px; flex: 1; }
  .modal-tab {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 4px 12px; border-radius: 5px; cursor: pointer;
  }
  .modal-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .modal-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }
  .modal-header-actions { display: flex; gap: 6px; }
  .modal-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-size: 14px; padding: 3px 8px;
    border-radius: 4px; cursor: pointer; line-height: 1;
  }
  .modal-btn:hover { border-color: var(--accent); color: var(--accent); }
  .modal-chart-area {
    padding: 12px 14px 6px;
    flex-shrink: 0;
  }
  #portfolio-donut { width: 100%; height: 240px; }
  .modal-holdings {
    flex: 1; overflow-y: auto;
    padding: 6px 14px 12px;
  }
  .modal-section-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted);
    margin: 8px 0 4px; border-bottom: 1px solid var(--border); padding-bottom: 2px;
  }
  .holdings-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .holdings-table th {
    text-align: left; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); padding: 3px 6px;
    border-bottom: 1px solid var(--border);
  }
  .holdings-table th:last-child,
  .holdings-table td:last-child { text-align: right; }
  .holdings-table td { padding: 4px 6px; border-bottom: 1px solid var(--border2); }
  .holdings-table tr:last-child td { border-bottom: none; }
  .ticker-cell { font-weight: 700; color: var(--accent); }
  .val-cell { color: var(--text); font-variant-numeric: tabular-nums; }
  .gain-pos { color: var(--green); }
  .gain-neg { color: var(--red); }
  .as-of { font-size: 10px; color: var(--muted); margin-left: auto; padding-right: 4px; }
  .modal-footer {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .footer-note { font-size: 11px; color: var(--muted); flex: 1; }


  /* ── Performance Modal ── */
  #perf-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 1000;
    align-items: center; justify-content: center;
  }
  #perf-modal.open { display: flex; }
  #perf-modal-body {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; width: 720px; max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .perf-header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .perf-title { font-weight: 700; font-size: 14px; color: var(--accent); flex: 1; }
  .perf-chart-area { padding: 10px 14px 4px; flex-shrink: 0; min-height: 0; }
  #perf-chart { width: 100%; height: 320px; }
  .perf-stats {
    display: flex; gap: 24px; padding: 8px 14px 12px; flex-wrap: wrap;
  }
  .perf-stat { text-align: center; }
  .perf-stat-val { font-size: 16px; font-weight: 700; color: var(--text); }
  .perf-stat-val.pos { color: var(--green); }
  .perf-stat-val.neg { color: var(--red); }
  .perf-stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .perf-footer { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); flex-shrink: 0; }

</style>
</head>
<body>

<!-- ── Topbar ── -->
<div class="topbar">
  <button id="sidebar-toggle" title="Toggle sidebar">☰</button>
  <div class="logo">⚡ Romhongbus</div>
  <div class="portfolio-group" style="display:flex;align-items:center;gap:5px;">
    <select id="portfolio-select">
      <option value="">— Portfolio —</option>
      <option value="irish">Irish</option>
      <option value="ignite">Ignite</option>
    </select>
    <button id="portfolio-alloc-btn" title="Show allocation" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:3px 9px;border-radius:4px;cursor:pointer;">%</button>
    <button id="portfolio-perf-btn" title="Show performance" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:3px 9px;border-radius:4px;cursor:pointer; font-weight:700;">R</button>
    <span id="portfolio-info" style="font-size:11px;color:var(--muted);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
  </div>
  <div class="ticker-input-group">
    <label>Ticker</label>
    <input id="ticker-input" type="text" value="SPY" placeholder="e.g. DGE.L" autocomplete="off" spellcheck="false">
  </div>
  <div class="tf-tabs">
    <button class="tf-btn active" data-tf="daily">Daily</button>
    <button class="tf-btn" data-tf="weekly">Weekly</button>
    <button class="tf-btn" data-tf="monthly">Monthly</button>
  </div>
  <button id="load-btn">Load</button>
  <button id="refresh-btn" title="Refresh data">↻</button>
  <div class="spacer"></div>
  <div class="status" id="status">Ready</div>
</div>

<!-- ── Settings bar ── -->
<div class="settings-bar">
  <span class="sec-label">Scale</span>
  <label class="tgl"><input type="checkbox" id="log_scale"><span class="tgl-label">Log</span></label>

  <span class="sep">|</span>

  <span class="sep">|</span>
  <span class="sec-label">SMA</span>
  <label class="tgl"><input type="checkbox" id="sma20_on" checked><span class="tgl-label sma20">20</span></label>
  <div class="grp"><input type="number" id="sma1" value="20" min="2" max="500"></div>
  <label class="tgl"><input type="checkbox" id="sma60_on" checked><span class="tgl-label sma60">60</span></label>
  <div class="grp"><input type="number" id="sma2" value="60" min="2" max="500"></div>
  <label class="tgl"><input type="checkbox" id="sma120_on" checked><span class="tgl-label sma120">120</span></label>
  <div class="grp"><input type="number" id="sma3" value="120" min="2" max="500"></div>
  <label class="tgl"><input type="checkbox" id="sma200_on" checked><span class="tgl-label sma200">200</span></label>
  <div class="grp"><input type="number" id="sma4" value="200" min="2" max="500"></div>

  <span class="sep">|</span>
  <span class="sec-label">BB</span>
  <label class="tgl"><input type="checkbox" id="show_bb"><span class="tgl-label">BB</span></label>
  <div class="grp"><label>Win</label><input type="number" id="bb_window" value="20" min="2" max="100"></div>
  <div class="grp"><label>Std</label><input type="number" id="bb_std" value="2" min="0.5" max="4" step="0.5"></div>

  <span class="sep">|</span>
  <span class="sec-label">Vol</span>
  <label class="tgl"><input type="checkbox" id="show_vol" checked><span class="tgl-label">Vol</span></label>
  <div class="grp"><label>H</label><input type="number" id="vol_h" value="12" min="5" max="35" style="width:42px;"></div>

  <span class="sep">|</span>
  <span class="sec-label">RSI</span>
  <label class="tgl"><input type="checkbox" id="show_rsi" checked><span class="tgl-label">RSI</span></label>
  <div class="grp"><label>W</label><input type="number" id="rsi_window" value="14" min="2" max="50"></div>
  <div class="grp"><label>H</label><input type="number" id="rsi_h" value="16" min="5" max="35" style="width:42px;"></div>

  <span class="sep">|</span>
  <span class="sec-label">MACD</span>
  <label class="tgl"><input type="checkbox" id="show_macd" checked><span class="tgl-label">MACD</span></label>
  <div class="grp">
    <input type="number" id="macd_fast" value="12" min="2" max="50" style="width:40px;">
    <span style="color:var(--muted)">/</span>
    <input type="number" id="macd_slow" value="26" min="2" max="50" style="width:40px;">
    <span style="color:var(--muted)">/</span>
    <input type="number" id="macd_signal" value="9" min="2" max="50" style="width:40px;">
  </div>
  <div class="grp"><label>H</label><input type="number" id="macd_h" value="16" min="5" max="35" style="width:42px;"></div>
</div>

<!-- ── Body ── -->
<div class="body-layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-loading" id="sidebar-loading">Loading watchlist…</div>
  </div>
  <div class="chart-area" id="chart-area">
    <div id="chart-container">
      <div class="placeholder" id="placeholder">
        <div class="emoji">📊</div>
        <div>Select a ticker from the sidebar or press Load</div>
      </div>
      <div id="chart"></div>
    </div>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script data-ts="1777155544">
// ── State ──────────────────────────────────────────────────────────────────
let currentData   = null;
let activeTf      = 'daily';
let activeTicker  = null;
let portfolioData = null;       // loaded portfolio data
let currentXRange = null;       // tracks current xaxis range for wheel zoom
let isLoading     = false;      // true while loadMoreData is in flight
let dataLoadedFrom = null;      // oldest timestamp in currentData
let dataLoadedTo   = null;      // newest timestamp in currentData

// ── Portfolio overlay helpers ──────────────────────────────────────────────
var chartDiv = document.getElementById('chart');

function formatPrice(p) {
  if (p == null || isNaN(p)) return '—';
  return p >= 1000 ? p.toFixed(0) : p >= 10 ? p.toFixed(1) : p.toFixed(2);
}

// ── Sidebar ─────────────────────────────────────────────────────────────────
const SECTION_LABELS = {
  primary:    'Primary',
  secondary:  'Secondary',
  index:      'Index',
  alternative:'Alternatives',
  sector:     'Sectors',
};

let watchlistData = null;  // full watchlist from server

function buildSidebar(data) {
  watchlistData = data;
  renderSidebar(data);
}

function renderSidebar(data) {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  Object.entries(data).forEach(([section, tickers]) => {
    if (!Array.isArray(tickers) || tickers.length === 0) return;
    const secEl = document.createElement('div');
    secEl.className = 'sidebar-section';
    const header = document.createElement('div');
    header.className = 'sidebar-header';
    header.innerHTML = `<span>${SECTION_LABELS[section] || section}</span><span class="arrow">▾</span>`;
    header.addEventListener('click', () => secEl.classList.toggle('collapsed'));
    const list = document.createElement('div');
    list.className = 'ticker-list';
    tickers.forEach(ticker => {
      const chip = document.createElement('div');
      chip.className = 'ticker-chip';
      chip.textContent = ticker;
      chip.addEventListener('click', () => loadTicker(ticker));
      list.appendChild(chip);
    });
    secEl.appendChild(header);
    secEl.appendChild(list);
    sidebar.appendChild(secEl);
  });
}

function loadTicker(ticker) {
  document.getElementById('ticker-input').value = ticker;
  activeTicker = ticker;
  document.querySelectorAll('.ticker-chip').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.ticker-chip').forEach(c => {
    if (c.textContent.trim() === ticker) c.classList.add('active');
  });
  loadChart();
}

function setStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (ok ? ' ok' : '');
}

// Count bars currently visible in the chart window (0 means show all)
function getVisibleCount(d) {
  if (!currentXRange || !d || !d.dates) return d.dates ? d.dates.length : 0;
  const [r0, r1] = currentXRange;
  let n = 0;
  for (let i = 0; i < d.dates.length; i++) {
    const t = +new Date(d.dates[i]);
    if (t >= r0 && t <= r1) n++;
  }
  return n;
}

// ── Settings ─────────────────────────────────────────────────────────────────
function getSettings() {
  return {

    sma1_on: document.getElementById('sma20_on').checked,
    sma1: parseInt(document.getElementById('sma1').value) || 20,
    sma2_on: document.getElementById('sma60_on').checked,
    sma2: parseInt(document.getElementById('sma2').value) || 60,
    sma3_on: document.getElementById('sma120_on').checked,
    sma3: parseInt(document.getElementById('sma3').value) || 120,
    sma4_on: document.getElementById('sma200_on').checked,
    sma4: parseInt(document.getElementById('sma4').value) || 200,
    bb_window: parseInt(document.getElementById('bb_window').value) || 20,
    bb_std: parseFloat(document.getElementById('bb_std').value) || 2,
    rsi_window: parseInt(document.getElementById('rsi_window').value) || 14,
    macd_fast: parseInt(document.getElementById('macd_fast').value) || 12,
    macd_slow: parseInt(document.getElementById('macd_slow').value) || 26,
    macd_signal: parseInt(document.getElementById('macd_signal').value) || 9,
    show_bb: document.getElementById('show_bb').checked,
    show_rsi: document.getElementById('show_rsi').checked,
    show_macd: document.getElementById('show_macd').checked,
    show_vol: document.getElementById('show_vol').checked,
  };
}

// ── Chart load ───────────────────────────────────────────────────────────────
function loadChart() {
  const ticker = document.getElementById('ticker-input').value.trim().toUpperCase();
  if (!ticker) return;
  const s = getSettings();
  const params = new URLSearchParams({
    ticker, tf: activeTf,

    sma1: s.sma1, sma2: s.sma2, sma3: s.sma3, sma4: s.sma4,
    bb_window: s.bb_window, bb_std: s.bb_std,
    rsi_window: s.rsi_window,
    macd_fast: s.macd_fast, macd_slow: s.macd_slow, macd_signal: s.macd_signal,
    limit: 400,   // start with 1.5yr for fast render, load more on scroll
  });
  setStatus('Loading…');
  document.getElementById('placeholder').classList.add('hidden');
  fetch('/api/chart_data?' + params)
    .then(r => r.json())
    .then(d => {
      if (d.error) { setStatus('Error: ' + d.error); return; }
      currentData = d;
      currentData.loaded_from = d.loaded_from || d.dates[0];
      currentData.loaded_to   = d.loaded_to   || d.dates[d.dates.length - 1];
      dataLoadedFrom = +new Date(currentData.dates[0]);
      dataLoadedTo   = +new Date(currentData.dates[currentData.dates.length - 1]);
      renderChart(d, true);
      setTimeout(() => {
        setStatus(d.ticker + ' · ' + d.tf + ' · ' + d.dates.length + ' loaded · ' + getVisibleCount(d) + ' shown', true);
        console.log('Initial status bar getVisibleCount:', getVisibleCount(d), 'currentXRange:', currentXRange ? [new Date(currentXRange[0]).toISOString().slice(0,10), new Date(currentXRange[1]).toISOString().slice(0,10)] : 'null');
      }, 100);
    })
    .catch(e => { console.error('loadTicker fetch failed:', e); isLoading = false; });
}


// ── Load More Data (on-demand historical append) ────────────────────────────
// direction: -1 = prepend older data (left), +1 = append newer data (right)

let loadMoreCount = 0;

async function loadMoreData(ticker, tf, direction) {
  var id = ++loadMoreCount;
  console.log('START', id, direction);
  if (isLoading) { console.log('busy, return'); return; }
  isLoading = true;
  try {
    setStatus('Loading more…');
    var resp = await fetch('/api/chart_data/more?ticker=' + encodeURIComponent(ticker) + '&tf=' + tf);
    if (!resp.ok) throw new Error('fetch ' + resp.status);
    var more = await resp.json();
    if (more.error) throw new Error(more.error);
    console.log('got', more.dates.length, 'bars');

    var curOldestTs = +new Date(currentData.dates[0]);
    var curNewestTs = +new Date(currentData.dates[currentData.dates.length - 1]);
    var moreDates0  = +new Date(more.dates[0]);
    var moreLast    = +new Date(more.dates[more.dates.length - 1]);

    var newKeys = ['dates','opens','highs','lows','closes','volumes','ema_a','ema_b','sma_a','sma_b','sma_c','sma_d','bb_up','bb_mid','bb_low','rsi','macd_line','macd_signal','macd_hist'];

    // The zoom range we want to apply after updating traces.
    // Use the pending range from the wheel event if available,
    // otherwise keep the current view.
    var targetXRange = pendingXRange || currentXRange;
    pendingXRange = null;   // clear it now

    function applyUpdate(newData) {
      // Replace currentData with full dataset
      newKeys.forEach(function(k) { if (newData[k]) currentData[k] = newData[k]; });
      // Use target range for visStart/visEnd so zoom is preserved
      var visStart = targetXRange ? targetXRange[0] : (+new Date(currentData.dates[0]));
      var visEnd   = targetXRange ? targetXRange[1] : (+new Date(currentData.dates[currentData.dates.length - 1]));
      var s = getSettings();
      var newTraces = buildChartTraces(currentData, s, visStart, visEnd);
      var newLayout = buildChartLayout(currentData, visStart, visEnd);
      Plotly.react('chart', newTraces, newLayout, { responsive: false, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d','select2d'], displaylogo: false });
      currentXRange = [visStart, visEnd];
      setStatus(currentData.ticker + ' · ' + currentData.tf + ' · ' + currentData.dates.length + ' loaded', true);
    }

    if (direction === -1) {
      // Left edge: check if all data already loaded
      if (curOldestTs === moreDates0) {
        // All historical data already in currentData — but might be subset. Replace with full.
        currentData.loaded_from = null;
        dataLoadedFrom = null;
        applyUpdate(more);
        console.log('DONE edge (full data loaded)', id);
        isLoading = false;
        return;
      }
      // Find truly older bars not in currentData
      var newIndices = [];
      for (var i = 0; i < more.dates.length; i++) {
        if (+new Date(more.dates[i]) < curOldestTs - 86400000) newIndices.push(i);
      }
      console.log('newIndices', newIndices.length, 'id', id);
      if (newIndices.length === 0) {
        currentData.loaded_from = null;
        dataLoadedFrom = null;
        applyUpdate(more);
        console.log('DONE empty (full data loaded)', id);
        isLoading = false;
        return;
      }
      // Prepend new older bars
      var newData = {};
      newKeys.forEach(function(k) {
        if (!more[k] || !currentData[k]) return;
        newData[k] = newIndices.map(function(i) { return more[k][i]; }).concat(currentData[k]);
      });
      currentData.loaded_from = null;
      dataLoadedFrom = null;
      applyUpdate(newData);
    } else {
      // Right edge: check if all newer data already loaded
      if (moreLast === curNewestTs) {
        currentData.loaded_to = null;
        dataLoadedTo = null;
        applyUpdate(more);
        console.log('DONE right edge (full data loaded)', id);
        isLoading = false;
        return;
      }
      var newIndices = [];
      for (var i = 0; i < more.dates.length; i++) {
        if (+new Date(more.dates[i]) > curNewestTs + 86400000) newIndices.push(i);
      }
      if (newIndices.length === 0) {
        currentData.loaded_to = null;
        dataLoadedTo = null;
        applyUpdate(more);
        console.log('DONE right empty (full data loaded)', id);
        isLoading = false;
        return;
      }
      var newData = {};
      newKeys.forEach(function(k) {
        if (!more[k] || !currentData[k]) return;
        newData[k] = currentData[k].concat(newIndices.map(function(i) { return more[k][i]; }));
      });
      currentData.loaded_to = currentData.dates[currentData.dates.length - 1];
      dataLoadedTo = +new Date(currentData.dates[currentData.dates.length - 1]);
      applyUpdate(newData);
    }
  } catch(e) {
    console.log('ERROR id', id, e.message);
    setStatus('Load more failed: ' + e.message, false);
  } finally {
    isLoading = false;
  }
}



// ── Render ───────────────────────────────────────────────────────────────────
function buildChartTraces(d, s, visStart, visEnd) {
  const UP='#00c88a', DN='#ff4444', C_EMA1='#00ccaa', C_EMA2='#ff9900', C_SMA1='#e0e0e0', C_SMA2='#ff4444', C_SMA3='#4488ff', C_SMA4='#00c88a', C_BB='#6677aa';
  const show_bb=!!s.show_bb, show_rsi=!!s.show_rsi, show_macd=!!s.show_macd, show_vol=!!s.show_vol;

  // Include ALL candles in traces — Plotly clips by xaxis.range for rendering
  var _d=d.dates, _o=d.opens, _h=d.highs, _l=d.lows, _c=d.closes, _v=d.volumes;
  var sl = a => (a||[]);

  var traces = [];
  traces.push({type:'candlestick', x:_d, open:_o, high:_h, low:_l, close:_c, name:'OHLC', increasing:{line:{color:UP},fillcolor:UP}, decreasing:{line:{color:DN},fillcolor:DN}, yaxis:'y', hoverinfo:'x+y'});

  if(s.sma1_on) traces.push({type:'scatter',x:_d,y:sl(d.sma_a),name:'SMA'+s.sma1,mode:'lines',line:{color:C_SMA1,width:1.2,dash:'dot'},yaxis:'y',hoverinfo:'skip'});
  if(s.sma2_on) traces.push({type:'scatter',x:_d,y:sl(d.sma_b),name:'SMA'+s.sma2,mode:'lines',line:{color:C_SMA2,width:1.2,dash:'dot'},yaxis:'y',hoverinfo:'skip'});
  if(s.sma3_on) traces.push({type:'scatter',x:_d,y:sl(d.sma_c),name:'SMA'+s.sma3,mode:'lines',line:{color:C_SMA3,width:1.2,dash:'dot'},yaxis:'y',hoverinfo:'skip'});
  if(s.sma4_on) traces.push({type:'scatter',x:_d,y:sl(d.sma_d),name:'SMA'+s.sma4,mode:'lines',line:{color:C_SMA4,width:1.5,dash:'dash'},yaxis:'y',hoverinfo:'skip'});
  if(show_bb){traces.push({type:'scatter',x:_d,y:sl(d.bb_up),name:'BB Upper',mode:'lines',line:{color:C_BB,width:0.8,dash:'dot'},yaxis:'y',fill:'none',hoverinfo:'skip'});
    traces.push({type:'scatter',x:_d,y:sl(d.bb_mid),name:'BB Mid',mode:'lines',line:{color:C_BB,width:0.5,dash:'dot'},yaxis:'y',hoverinfo:'skip'});
    traces.push({type:'scatter',x:_d,y:sl(d.bb_low),name:'BB Lower',mode:'lines',line:{color:C_BB,width:0.8,dash:'dot'},yaxis:'y',fill:'tonexty',fillcolor:'rgba(100,119,170,0.07)',hoverinfo:'skip'});}
  if(show_vol){var vc=_o.map((o,i)=>(_c[i]!=null&&_c[i]>=o)?UP+'88':DN+'88');traces.push({type:'bar',x:_d,y:_v,name:'Vol',marker:{color:vc,line:{width:0}},yaxis:'y2',showlegend:false,hoverinfo:'x'});}
  if(show_rsi){traces.push({type:'scatter',x:_d,y:sl(d.rsi),name:'RSI',mode:'lines',line:{color:'#aa88ff',width:1.5},yaxis:'y3',showlegend:false,hoverinfo:'skip'});
    traces.push({type:'scatter',x:[_d[0],_d[_d.length-1]],y:[70,70],mode:'lines',line:{color:'#ff4444',width:0.8,dash:'dot'},yaxis:'y3',showlegend:false,hoverinfo:'skip'});
    traces.push({type:'scatter',x:[_d[0],_d[_d.length-1]],y:[30,30],mode:'lines',line:{color:'#00c88a',width:0.8,dash:'dot'},yaxis:'y3',showlegend:false,hoverinfo:'skip'});}
  if(show_macd){var mc=sl(d.macd_hist).map(h=>h>=0?UP:DN);traces.push({type:'bar',x:_d,y:sl(d.macd_hist),name:'MACD Hist',marker:{color:mc,line:{width:0}},yaxis:'y4',showlegend:false,hoverinfo:'skip'});
    traces.push({type:'scatter',x:_d,y:sl(d.macd_line),name:'MACD',mode:'lines',line:{color:'#00aaff',width:1.5},yaxis:'y4',showlegend:false,hoverinfo:'skip'});
    traces.push({type:'scatter',x:_d,y:sl(d.macd_signal),name:'Signal',mode:'lines',line:{color:C_EMA2,width:1.2},yaxis:'y4',showlegend:false,hoverinfo:'skip'});}
  return traces;
}


function buildChartLayout(d, visStart, visEnd) {
  const s = getSettings();
  const show_bb = s.show_bb, show_rsi = s.show_rsi;
  const show_macd = s.show_macd, show_vol = s.show_vol;

  const activeRows = ['main'];
  if (show_vol)  activeRows.push('vol');
  if (show_rsi)  activeRows.push('rsi');
  if (show_macd) activeRows.push('macd');

  const mainShare = activeRows.length === 1 ? 1.0 : (
    1.0 - (show_vol  ? parseFloat(document.getElementById('vol_h').value  || 12) / 100 : 0)
        - (show_rsi  ? parseFloat(document.getElementById('rsi_h').value  || 16) / 100 : 0)
        - (show_macd ? parseFloat(document.getElementById('macd_h').value || 16) / 100 : 0)
  );
  const volH  = show_vol  ? (parseFloat(document.getElementById('vol_h').value)  || 12) / 100 : 0;
  const rsiH  = show_rsi  ? (parseFloat(document.getElementById('rsi_h').value)  || 16) / 100 : 0;
  const macdH = show_macd ? (parseFloat(document.getElementById('macd_h').value) || 16) / 100 : 0;
  const spacer = 0.03;

  const layoutAxes = {};
  const useLog = document.getElementById('log_scale').checked;
  layoutAxes['yaxis'] = {
    domain: [1 - mainShare, 1.0], side: 'right', showgrid: true, gridcolor: '#1e1e1e',
    zeroline: false, tickfont: {color: '#888', size: 10},
    title: {text: 'Price', standoff: 8}, fixedrange: false,
    type: useLog ? 'log' : 'linear',
  };

  let top = 1 - mainShare - spacer;
  if (show_vol) {
    layoutAxes['yaxis2'] = { domain: [top - volH, top], side: 'right', showgrid: false, zeroline: false, tickfont: {color: '#666', size: 9}, title: {text: 'Vol', standoff: 8}, fixedrange: true };
    top = top - volH - spacer;
  }
  if (show_rsi) {
    layoutAxes['yaxis3'] = { domain: [top - rsiH, top], side: 'right', showgrid: false, zeroline: true, zerolinecolor: '#333', tickfont: {color: '#666', size: 9}, title: {text: 'RSI', standoff: 8}, fixedrange: true };
    top = top - rsiH - spacer;
  }
  if (show_macd) {
    layoutAxes['yaxis4'] = { domain: [0.0, top], side: 'right', showgrid: false, zeroline: true, zerolinecolor: '#333', tickfont: {color: '#666', size: 9}, title: {text: 'MACD', standoff: 8}, fixedrange: true };
  }

  layoutAxes['xaxis'] = {
    showgrid: true, gridcolor: '#1e1e1e', zeroline: false,
    tickfont: {color: '#666', size: 10}, rangeslider: {visible: true, thickness: 0.06}, spikecolor: '#333',
  };

  const containerRect = document.getElementById('chart-container').getBoundingClientRect();

  // Visible X window — passed in from renderChart
  const visibleStartISO = new Date(visStart).toISOString().slice(0, 10);
  const visibleEndISO   = new Date(visEnd).toISOString().slice(0, 10);
  const xaxisRange = [visibleStartISO, visibleEndISO];

  // Compute Y range from visible candle highs/lows
  let eMin = Infinity, eMax = -Infinity;
  for (let i = 0; i < d.dates.length; i++) {
    const t = +new Date(d.dates[i]);
    if (t < visStart || t > visEnd) continue;
    if (d.highs[i] != null) eMax = Math.max(eMax, d.highs[i]);
    if (d.lows[i]  != null) eMin = Math.min(eMin, d.lows[i]);
  }
  const priceSpan = eMax - eMin || eMax * 0.01;
  const yPad = priceSpan * 0.08;
  const yRange = [
    Math.log10(Math.max(0.001, eMin - yPad)),   // log scale: range in log10 space
    Math.log10(eMax + yPad),
  ];
  const yRangeLinear = [Math.max(0.001, eMin - yPad), eMax + yPad];  // linear scale
  const useYRange = useLog ? yRange : yRangeLinear;

  // Build dynamic tick labels for the Y axis
  // On log scale: generate tickvals in log10-space with actual $ labels
  // On linear scale: use auto ticks
  let yTickvals, yTicktext;
  if (useLog) {
    // Find a nice round starting price <= eMin and generate ticks at fixed $ intervals
    const start = Math.floor(eMin / 50) * 50;  // e.g. 450
    const tickInterval = 25;  // every $25
    const ticks = [];
    for (let p = start; p <= eMax + 50; p += tickInterval) ticks.push(p);
    // Convert to log10 for tickvals, keep as-is for ticktext
    yTickvals = ticks.map(Math.log10);   // log10(price) — correct for log-axis tickmode array
    yTicktext = ticks.map(p => p >= 1000 ? ('$' + (p/1000).toFixed(p % 100 === 0 ? 0 : 1) + 'k') : ('$' + p));
  }

  console.log('Y range:', { visStartISO: visibleStartISO, visEndISO: visibleEndISO, eMin: Math.round(eMin), eMax: Math.round(eMax), yRangeLinear: yRangeLinear.map(v => Math.round(v)), logScale: useLog, yTicktext: useLog ? yTicktext : 'auto' });

  const layout = {
    paper_bgcolor: '#0d0d0d', plot_bgcolor: '#0d0d0d',
    font: {color: '#e0e0e0', size: 11, family: 'Segoe UI, Arial'},
    title: {text: d.ticker + ' — ' + d.tf.charAt(0).toUpperCase() + d.tf.slice(1), font:{color: '#00ccaa', size: 14}},
    margin: {t: 55, r: 70, b: 60, l: 60},
    showlegend: false, hovermode: 'x unified', dragmode: 'pan',
    ...layoutAxes,
    legend: {orientation: 'h', y: 1.03, x: 0.5, xanchor: 'center', font:{color:'#888', size:10}},
    width: containerRect.width || 800,
    height: containerRect.height || 500,
    xaxis: {
      ...layoutAxes['xaxis'],
      range: xaxisRange,
    },
    yaxis: {
      ...layoutAxes['yaxis'],
      range: useYRange,
      autorange: false,
      tickmode: useLog ? 'array' : 'auto',
      tickvals: useLog ? yTickvals : undefined,
      ticktext: useLog ? yTicktext : undefined,
    },
  };
  return layout;
}

function renderChart(d, isInitial) {
  const s = getSettings();

  // Determine visible X window
  let visStart, visEnd;
  if (isInitial) {
    const d0ts = +new Date(d.dates[0]);
    const d1ts = +new Date(d.dates[d.dates.length - 1]);
    const lookbackDays = d.tf === 'monthly' ? 365 * 7.5 : d.tf === 'weekly' ? 365 * 2.5 : 365;
    const lookbackMs  = lookbackDays * 86400000;
    visStart = Math.max(d0ts, d1ts - lookbackMs);
    visEnd   = d1ts;
    const visSpan  = visEnd - visStart;
    const rightPad = Math.max(visSpan * 0.005, 86400000 * 2);
    currentXRange = [visStart, visEnd + rightPad];
    console.log('=== renderChart initial ===', {
      isInitial,
      dataStart: d.dates[0],
      dataEnd: d.dates[d.dates.length - 1],
      visStart: new Date(visStart).toISOString().slice(0,10),
      visEnd:   new Date(visEnd  ).toISOString().slice(0,10),
      lookbackDays,
      totalBars: d.dates.length
    });
  } else {
    visStart = currentXRange[0];
    visEnd   = currentXRange[1];
    console.log('=== renderChart update ===', {
      isInitial,
      visStart: new Date(visStart).toISOString().slice(0,10),
      visEnd:   new Date(visEnd  ).toISOString().slice(0,10)
    });
  }

  // Build traces (filtered to visible window) and layout
  const traces = buildChartTraces(d, s, visStart, visEnd);
  const layout = buildChartLayout(d, visStart, visEnd);

  const config = {
    responsive: false, displayModeBar: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d'], displaylogo: false,
  };
  Plotly.purge('chart');
  const containerRect = document.getElementById('chart-container').getBoundingClientRect();
  const chartEl = document.getElementById('chart');
  chartEl.style.width  = (containerRect.width  || 800) + 'px';
  chartEl.style.height = (containerRect.height || 500) + 'px';
  Plotly.newPlot('chart', traces, layout, config).then(() => {
    const lr = document.getElementById('chart')._fullLayout;
    console.log('newPlot xaxis range:', JSON.stringify(lr.xaxis.range));
    console.log('newPlot yaxis range:', JSON.stringify(lr.yaxis.range));
  }).catch(e => setStatus('Plot error: ' + e.message));
}

  var tickers = h.map(function(x) { return x.ticker; });
  var values  = h.map(function(x) { return Math.abs(x[valKey] || 0); });
  var cashGbp = data.cash_gbp || 0;
  var total   = values.reduce(function(s, v) { return s + v; }, 0) + cashGbp;

  // Add cash as a separate slice
  if (cashGbp > 0) {
    tickers.push('Cash');
    values.push(cashGbp);
  }

  // Colour palette for donut segments
  var palette = ['#00ccaa','#ff9900','#4488ff','#ff4444','#aa88ff','#00aaff','#ffcc00','#ff6699','#66ffcc','#cc88ff'];
  var colors  = tickers.map(function(_, i) { return palette[i % palette.length]; });

  var donutData = [{
    type: 'pie',
    labels: tickers,
    values: values,
    hole: 0.55,
    textinfo: 'label+percent',
    textposition: 'outside',
    automargin: true,
    marker: { colors: colors },
    sort: false,
    hoverinfo: 'label+value+percent',
  }];

  var annotText = total > 0
    ? ('£' + total.toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 0 }))
    : '';

  var donutLayout = {
    showlegend: false,
    margin: { t: 10, b: 10, l: 10, r: 10 },
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    font: { color: '#e0e0e0', size: 12 },
    annotations: total > 0 ? [{
      text: annotText + '<br><span style="font-size:10px;color:#666">total</span>',
      x: 0.5, y: 0.5,
      showarrow: false,
      font: { color: '#e0e0e0', size: 13 },
      align: 'center',
      valign: 'middle',
    }] : [],
  };

  Plotly.react('portfolio-donut', donutData, donutLayout, {
    responsive: true,
    displayModeBar: false,
    displaylogo: false,
  });

  // ── Holdings table ────────────────────────────────────────────────────────
  var tbody = document.getElementById('holdings-body');
  var rows = '';

  // Holdings rows
  h.forEach(function(x) {
    var val  = x[valKey]  || 0;
    var gain = x[gainKey] || 0;
    var gainClass = gain >= 0 ? 'gain-pos' : 'gain-neg';
    var gainStr  = (gain >= 0 ? '+' : '−') + '£' + Math.abs(gain).toFixed(2);
    var valStr   = '£' + Math.abs(val).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    var qtyStr   = x[qtyKey] != null ? x[qtyKey].toString() : '—';
    rows += '<tr>' +
      '<td class="ticker-cell">' + x.ticker + '</td>' +
      '<td class="val-cell">' + qtyStr + '</td>' +
      '<td class="val-cell">' + valStr + '</td>' +
      '<td class="' + gainClass + '">' + gainStr + '</td>' +
      '</tr>';
  });

  // Cash row
  if (cashGbp > 0) {
    var cashStr = '£' + cashGbp.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    rows += '<tr style="border-top:2px solid var(--border);">' +
      '<td class="ticker-cell" style="color:var(--muted)">Cash</td>' +
      '<td class="val-cell">—</td>' +
      '<td class="val-cell">' + cashStr + '</td>' +
      '<td class="gain-pos">—</td>' +
      '</tr>';
  }

  tbody.innerHTML = rows;
}

// ── Modal event bindings (run after DOM is ready) ─────────────────────────
window.addEventListener('DOMContentLoaded', function() {

// Close button
  document.getElementById('modal-close-btn').addEventListener('click', function() {

  });

    setTimeout(function() { Plotly.relayout('portfolio-donut', { autosize: true }); }, 50);
  });

  // Click outside modal body to close
  document.getElementById('portfolio-modal').addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('open');
    }
  });

  // Portfolio dropdown — opens modal on selected portfolio tab
  
// ── Performance Modal ─────────────────────────────────────────────────────────
function openPerfModal(key) {
  var modal = document.getElementById('perf-modal');
  modal.classList.add('open');

  var title = document.getElementById('perf-title');
  title.textContent = (key === 'ignite' ? 'Ignite' : 'Irish') + ' Performance';

  document.getElementById('perf-stats').innerHTML = '<div style="color:var(--muted);font-size:12px;padding:20px 0;">Loading…</div>';
  document.getElementById('perf-chart').innerHTML = '';
  document.getElementById('perf-footer').textContent = '';

  fetch('/api/portfolio/performance?key=' + encodeURIComponent(key))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        document.getElementById('perf-stats').innerHTML =
          '<div style="color:var(--red);font-size:12px;padding:20px 0;">' + data.error + '</div>';
        return;
      }
      renderPerfModal(data);
    })
    .catch(function(e) {
      document.getElementById('perf-stats').innerHTML =
        '<div style="color:var(--red);font-size:12px;padding:20px 0;">Error: ' + e.message + '</div>';
    });
}

function renderPerfModal(data) {
  var curve = data.curve || [];
  if (!curve.length) return;

  var dates  = curve.map(function(c) { return c.date; });
  var values = curve.map(function(c) { return c.value; });

  // Trace 1: portfolio value
  var traceVal = {
    type: 'scatter',
    x: dates, y: values,
    mode: 'lines', name: 'Value',
    line: { color: '#00ccaa', width: 2 },
    fill: 'tonexty', fillcolor: 'rgba(0,204,170,0.08)',
    hoverinfo: 'x+y',
  };

  var layout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    font: { color: '#e0e0e0', size: 12 },
    xaxis: {
      gridcolor: '#222', linecolor: '#333', mirror: true,
      tickfont: { color: '#888', size: 10 },
      type: 'date',
    },
    yaxis: {
      gridcolor: '#222', linecolor: '#333', mirror: true,
      tickfont: { color: '#888', size: 10 },
      tickprefix: '£', hoverformat: ',.0f',
      type: 'log', domain: [0, 1],
    },
    legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: 1.02 },
    margin: { t: 10, b: 40, l: 60, r: 20 },
    showlegend: true,
  };

  Plotly.newPlot('perf-chart', [traceVal], layout, {
    responsive: true, displayModeBar: false, displaylogo: false,
  });

  // Stats
  var first = values[0];
  var last  = values[values.length - 1];
  var peak  = Math.max.apply(null, values);
  var trough= Math.min.apply(null, values);
  var gain  = last - first;
  var retPct= first > 0 ? ((last - first) / first * 100) : 0;
  var maxDD = first > 0 ? ((trough - peak) / peak * 100) : 0;

  var posNeg = function(v) { return v >= 0 ? 'pos' : 'neg'; };
  var fmtGbp = function(v) { return '£' + Math.abs(v).toLocaleString('en-GB', {minimumFractionDigits:0,maximumFractionDigits:0}); };
  var fmtPct = function(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%'; };

  document.getElementById('perf-stats').innerHTML =
    '<div class="perf-stat"><div class="perf-stat-val">' + fmtGbp(last) + '</div><div class="perf-stat-lbl">Value</div></div>' +
    '<div class="perf-stat"><div class="perf-stat-val ' + posNeg(gain) + '">' + fmtPct(retPct) + '</div><div class="perf-stat-lbl">Total Return</div></div>' +
    '<div class="perf-stat"><div class="perf-stat-val neg">' + fmtPct(maxDD) + '</div><div class="perf-stat-lbl">Max Drawdown</div></div>' +
    '<div class="perf-stat"><div class="perf-stat-val">' + fmtGbp(last - first) + '</div><div class="perf-stat-lbl">P&amp;L</div></div>';

  document.getElementById('perf-footer').textContent =
    'Ignite portfolio · since ' + data.start + ' · ' + data.tickers.join(', ');
}

// Portfolio Performance button — opens equity curve modal
  document.getElementById('portfolio-perf-btn').addEventListener('click', function() {
    var key = document.getElementById('portfolio-select').value || '';
    if (!key) {
      alert('Select a portfolio first (Irish or Ignite)');
      return;
    }
    openPerfModal(key);
  });

  // Performance modal close
  document.getElementById('perf-close-btn').addEventListener('click', function() {
    document.getElementById('perf-modal').classList.remove('open');
  });

  // Click outside to close
  document.getElementById('perf-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  // Portfolio dropdown — update sidebar with all historical tickers for selected portfolio
  document.getElementById('portfolio-select').addEventListener('change', function() {
    var key = this.value;
    if (!key) {
      portfolioData = null;
      // Restore full watchlist sidebar
      if (watchlistData) renderSidebar(watchlistData);
      if (currentData) renderChart(currentData, false);
      setTimeout(resizeChart, 250);
      return;
    }
    // Load portfolio data and update sidebar with ALL tickers ever traded
    fetch('/api/portfolios')
      .then(r => r.json())
      .then(function(data) {
        portfolioData = data[key] || null;
        if (!portfolioData) return;
        var h = portfolioData.holdings || [];
        // Use all_tickers (historical) not just current holdings for the sidebar
        var allTickers = portfolioData.all_tickers || h.map(function(x) { return x.ticker; });
        var portSections = { primary: allTickers, secondary: [], index: [], alternative: [], sector: [] };
        renderSidebar(portSections);
        // Also update the info text
        var infoEl = document.getElementById('portfolio-info');
        if (infoEl) infoEl.textContent = portfolioData.name + ' · ' + allTickers.length + ' tickers';
        setTimeout(resizeChart, 250);
      })
      .catch(function(e) { console.error('Portfolio load error:', e); });
  });

  // Allocation button — opens modal on currently selected portfolio tab (or Irish)
  document.getElementById('portfolio-alloc-btn').addEventListener('click', function() {
    var key = document.getElementById('portfolio-select').value || 'irish';
    openPortfolioModal(key);
  });

});

// Trigger chart resize after DOM changes (sidebar toggle, portfolio switch)
function resizeChart() {
  setTimeout(() => {
    if (document.getElementById('chart').data && currentData) {
      const chartArea = document.getElementById('chart-area');
      void chartArea.offsetHeight;
      const containerRect = document.getElementById('chart-container').getBoundingClientRect();
      // Recompute Y range to visible candles
      const xRange = currentXRange || [
        +new Date(currentData.dates[0]),
        +new Date(currentData.dates[currentData.dates.length - 1])
      ];
      let rMin = Infinity, rMax = -Infinity;
      for (let i = 0; i < currentData.dates.length; i++) {
        const t = +new Date(currentData.dates[i]);
        if (t < xRange[0] || t > xRange[1]) continue;
        if (currentData.highs[i] != null) rMax = Math.max(rMax, currentData.highs[i]);
        if (currentData.lows[i]  != null) rMin = Math.min(rMin, currentData.lows[i]);
      }
      const rSpan = rMax - rMin || rMax * 0.01;
      const rPad  = rSpan * 0.08;
      Plotly.relayout('chart', {
        width: containerRect.width, height: containerRect.height,
        'yaxis.range': [rMin - rPad, rMax + rPad],
      }).then(() => {
        setStatus(currentData.ticker + ' · ' + currentData.tf + ' · ' + currentData.dates.length + ' loaded · ' + getVisibleCount(currentData) + ' shown', true);
    console.log('Status bar getVisibleCount:', getVisibleCount(currentData));
    // Verify what the chart actually shows by reading back from Plotly
    const chartData = document.getElementById('chart').data;
    if (chartData && chartData[0] && chartData[0].x) {
      console.log('Chart actual x.length:', chartData[0].x.length, 'first:', chartData[0].x[0], 'last:', chartData[0].x[chartData[0].x.length-1]);
    }
      });
    }
  }, 150);
}

window.addEventListener('resize', () => {
  if (document.getElementById('chart').data) {
    const containerRect = document.getElementById('chart-container').getBoundingClientRect();
    Plotly.relayout('chart', { width: containerRect.width, height: containerRect.height }).then(() => {
      setStatus(currentData.ticker + ' · ' + currentData.tf + ' · ' + currentData.dates.length + ' loaded · ' + getVisibleCount(currentData) + ' shown', true);
    console.log('Status bar getVisibleCount:', getVisibleCount(currentData));
    // Verify what the chart actually shows by reading back from Plotly
    const chartData = document.getElementById('chart').data;
    if (chartData && chartData[0] && chartData[0].x) {
      console.log('Chart actual x.length:', chartData[0].x.length, 'first:', chartData[0].x[0], 'last:', chartData[0].x[chartData[0].x.length-1]);
    }
    });
  }
});

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
  resizeChart();
});

// Mouse wheel zoom — scroll up zooms in, scroll down zooms out
// The visible right edge (last bar + its gap) stays fixed; left edge moves
let isWheeling = false;
let pendingXRange = null;   // if set, loadMoreData will apply this xaxis range after updating traces
document.getElementById('chart-area').addEventListener('wheel', function(evt) {
  console.log('WHEEL EVENT:', evt.deltaY, 'isLoading:', isLoading);
  if (!currentData || !currentData.dates || currentData.dates.length === 0) return;
  evt.preventDefault();
  if (isWheeling) return;   // debounce: ignore if wheel event still pending
  isWheeling = true;
  setTimeout(() => { isWheeling = false; }, 200);
  const dates = currentData.dates;
  const total = dates.length;
  const currentRange = currentXRange;
  if (!currentRange) return;
  if (Math.abs(evt.deltaY) < 20) return;

  const d0 = +new Date(dates[0]);
  const lastBar = +new Date(dates[dates.length - 1]);
  const zoomFactor = Math.pow(1.06, evt.deltaY / 50);
  const [r0, r1] = currentRange;
  const currentSpan = r1 - r0;
  const newSpan = Math.max(currentSpan * zoomFactor, total * 0.005, 86400000 * 3);

  // Keep the visible right edge (r1) fixed — preserves last bar + its gap
  const clampedR1 = r1;
  // Don't let left edge go before first data point
  const maxSpan = clampedR1 - d0;
  const cappedSpan = Math.min(newSpan, maxSpan);
  // Clamp left edge: if it would extend beyond available data, anchor to data start
  // This prevents showing empty chart space before the first data bar
  const unclampedR0 = clampedR1 - cappedSpan;
  const clampedR0 = unclampedR0 < d0 ? d0 : unclampedR0;

  // Check if we need to load more data at either edge
  // Left: scroll down → zoom out → left edge expands → fetch older data
  // Right: scroll up (zoom in) near right boundary → fetch newer data, load more
  const loadedFrom = dataLoadedFrom || d0;
  const loadedTo   = dataLoadedTo   || lastBar;
  const rightGap = loadedTo - clampedR1;
  const leftGap  = (dataLoadedFrom || d0) - clampedR0;
  const isNearRightEdge = rightGap < (r1 - r0) * 0.1;

  // ── Load-more decision ────────────────────────────────────────────────
  // Strategy: call loadMoreData ONLY when there's a genuine gap to fill AND
  // more data exists. Otherwise just zoom (Plotly.relayout below).
  //
  // Left gap > 0  → empty space to the left of chart → need older bars
  // Right gap > 0 → empty space to the right → need newer bars
  //
  // loaded_from/loaded_to = null means that edge has been confirmed exhausted.
  // When null, skip fetch entirely and fall through to pure zoom.

  // Save the desired new xaxis range (for zoom) — needed because loadMoreData
  // will call Plotly.react which overwrites xaxis.range with savedXRange.
  // We store it in pendingXRange and loadMoreData applies it after Plotly.react.
  const newXRange = [clampedR0, clampedR1];

  if (!isLoading) {
    // Left — scroll down (zoom out left)
    if (evt.deltaY > 0 && leftGap > 0 && currentData.loaded_from !== null) {
      pendingXRange = newXRange;   // tell loadMoreData what range to use after react
      loadMoreData(currentData.ticker, activeTf, -1);
      return;   // loadMoreData will handle zoom when it finishes
    }
    // Right — scroll up (zoom in right) when near right boundary
    else if (evt.deltaY < 0 && rightGap > 0 && currentData.loaded_to !== null) {
      pendingXRange = newXRange;
      loadMoreData(currentData.ticker, activeTf, +1);
      return;
    }
    // Otherwise → no gap or edge confirmed exhausted → pure zoom below
  }

  // No loadMoreData needed — pure zoom via Plotly.relayout
  let wheelMin = Infinity, wheelMax = -Infinity;
  for (let i = 0; i < dates.length; i++) {
    const t = +new Date(dates[i]);
    if (t < clampedR0 || t > clampedR1) continue;
    if (currentData.highs[i] != null) wheelMax = Math.max(wheelMax, currentData.highs[i]);
    if (currentData.lows[i]  != null) wheelMin = Math.min(wheelMin, currentData.lows[i]);
  }
  const wheelSpan = wheelMax - wheelMin || wheelMax * 0.01;
  const wheelPad  = wheelSpan * 0.08;
  const useLog = document.getElementById('log_scale').checked;
  const wheelYRange = useLog
    ? [Math.log10(Math.max(0.001, wheelMin - wheelPad)), Math.log10(wheelMax + wheelPad)]
    : [Math.max(0.001, wheelMin - wheelPad), wheelMax + wheelPad];

  function tsToDateStr(ts) {
    return new Date(ts).toISOString().slice(0, 10);
  }

  Plotly.relayout('chart', {
    'xaxis.range': [tsToDateStr(clampedR0), tsToDateStr(clampedR1)],
    'yaxis.range': wheelYRange,
    'yaxis.autorange': false,
  }).then(() => {
    currentXRange = [clampedR0, clampedR1];
    // Y-axis was recomputed from visible candles above — log it
    const layout = document.getElementById('chart')._fullLayout;
    console.log('Post-relayout yaxis range:', JSON.stringify(layout.yaxis.range));
    console.log('Post-relayout xaxis range:', JSON.stringify(layout.xaxis.range));
    setStatus(currentData.ticker + ' · ' + currentData.tf + ' · ' + currentData.dates.length + ' loaded · ' + getVisibleCount(currentData) + ' shown', true);
    console.log('Status bar getVisibleCount:', getVisibleCount(currentData));
    // Verify what the chart actually shows by reading back from Plotly
    const chartData = document.getElementById('chart').data;
    if (chartData && chartData[0] && chartData[0].x) {
      console.log('Chart actual x.length:', chartData[0].x.length, 'first:', chartData[0].x[0], 'last:', chartData[0].x[chartData[0].x.length-1]);
    }
  });
});

window.addEventListener('load', () => {
  activeTicker = document.getElementById('ticker-input').value.trim().toUpperCase();
  loadChart();
});
</script>
